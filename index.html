<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمێ کاشێریێ یێ سەردەمیانە & بارکۆد</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: radial-gradient(circle at top right, #1e1b4b, #0f172a); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        .sidebar { width: 260px; background: var(--card-bg); backdrop-filter: blur(12px); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px; }
        .sidebar h2 { font-size: 22px; color: var(--accent-color); margin-bottom: 30px; text-align: center; }

        .nav-btn { background: transparent; border: 1px solid transparent; color: var(--text-muted); padding: 14px 16px; font-size: 16px; border-radius: 12px; cursor: pointer; text-align: right; margin-bottom: 10px; transition: all 0.3s ease; }
        .nav-btn:hover, .nav-btn.active { background: var(--accent-color); color: white; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); }

        .main-content { flex: 1; padding: 24px; overflow-y: auto; }
        .section { display: none; }
        .section.active { display: block; }

        .pos-grid { display: grid; grid-template-columns: 2.2fr 1fr; gap: 20px; height: calc(100vh - 48px); }
        .products-section { display: flex; flex-direction: column; gap: 15px; }
        .search-box { display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.6); color: white; font-size: 16px; }

        .products-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; overflow-y: auto; max-height: calc(100vh - 180px); padding-left: 5px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s ease; backdrop-filter: blur(8px); }
        .product-card:hover { transform: translateY(-4px); border-color: var(--accent-color); }
        .product-card.out-of-stock { opacity: 0.5; cursor: not-allowed; border-color: var(--danger); }
        .product-card h4 { margin-bottom: 8px; font-size: 16px; }
        .product-card .barcode-tag { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .product-card .stock-tag { font-size: 12px; color: var(--accent-color); margin-bottom: 6px; }
        .product-card .price { color: var(--success); font-weight: bold; font-size: 18px; }

        .cart-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; backdrop-filter: blur(12px); }
        .cart-items { flex: 1; overflow-y: auto; margin: 15px 0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(15, 23, 42, 0.4); border-radius: 10px; margin-bottom: 8px; }
        .cart-item-actions { display: flex; gap: 8px; align-items: center; }
        .btn-qty { background: var(--accent-color); color: white; border: none; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .btn-checkout { background: var(--success); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-checkout:hover { opacity: 0.9; }

        #scanner-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .scanner-box { background: var(--bg-color); padding: 20px; border-radius: 16px; width: 400px; text-align: center; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 16px; }
        .stat-card h3 { color: var(--text-muted); font-size: 14px; margin-bottom: 8px; }
        .stat-card p { font-size: 26px; font-weight: bold; }

        .admin-flex { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); }
        th { background: rgba(15, 23, 42, 0.8); }

        .btn-delete { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .form-control { margin-bottom: 12px; }
        .form-control label { display: block; margin-bottom: 4px; font-size: 14px; }
        .form-control input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.6); color: white; }

        @media print {
            body * { visibility: hidden; }
            #receipt-print, #receipt-print * { visibility: visible; }
            #receipt-print { position: absolute; left: 0; top: 0; width: 100%; color: black; background: white; padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>سیستەمێ کاشێریێ</h2>
        <button class="nav-btn active" onclick="switchTab('pos')">پشکا کاشێری (POS)</button>
        <button class="nav-btn" onclick="checkAdmin()">پشکا رێڤەبەری (Dashboard)</button>
    </div>

    <div class="main-content">
        <div id="pos-tab" class="section active">
            <div class="pos-grid">
                <div class="products-section">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="لێگەڕیان ب ناڤ یان بارکۆد..." onkeyup="handleSearch(event)">
                        <button class="nav-btn" style="margin:0;" onclick="openScanner()">کامێرا بارکۆد 📷</button>
                    </div>
                    <div class="products-cards" id="products-list"></div>
                </div>

                <div class="cart-panel">
                    <h3>سەبەتەیا فرۆشتنێ</h3>
                    <div class="cart-items" id="cart-items"></div>
                    <div style="margin-bottom: 15px; font-size: 20px; font-weight: bold;">
                        کۆم: $<span id="cart-total">0.00</span>
                    </div>
                    <button class="btn-checkout" onclick="checkout()">تەمامکرن & چاپکرن</button>
                </div>
            </div>
        </div>

        <div id="admin-tab" class="section">
            <h2 style="margin-bottom: 20px;">داشبۆردا رێڤەبەری & زانیاریێن دارایی</h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>کۆما فرۆشتنان</h3>
                    <p id="total-sales">$0.00</p>
                </div>
                <div class="stat-card">
                    <h3>کۆما تێچووی</h3>
                    <p id="total-cost">$0.00</p>
                </div>
                <div class="stat-card">
                    <h3>قازانجا پاقژ</h3>
                    <p id="net-profit" style="color: var(--success);">$0.00</p>
                </div>
            </div>

            <div class="admin-flex">
                <div>
                    <h3>لیستا کەلاپەلان & عەمبار</h3>
                    <br>
                    <table>
                        <thead>
                            <tr>
                                <th>کەلاپەل</th>
                                <th>عەمبار</th>
                                <th>فرۆشتن</th>
                                <th>کردار</th>
                            </tr>
                        </thead>
                        <tbody id="admin-products-body"></tbody>
                    </table>
                </div>

                <div>
                    <h3>زێدەکرنا کەلاپەلەکێ نۆی</h3>
                    <br>
                    <form onsubmit="saveProduct(event)" style="background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
                        <div class="form-control">
                            <label>کۆدێ بارکۆدی:</label>
                            <input type="text" id="prod-barcode" required placeholder="بارکۆدی سکان بکە">
                        </div>
                        <div class="form-control">
                            <label>ناڤێ کەلاپەلی:</label>
                            <input type="text" id="prod-name" required>
                        </div>
                        <div class="form-control">
                            <label>بڕ د عەمبارێ دا (Stock):</label>
                            <input type="number" id="prod-stock" required value="10">
                        </div>
                        <div class="form-control">
                            <label>بیهایێ کریارێ (تێچوو):</label>
                            <input type="number" step="0.01" id="prod-cost" required>
                        </div>
                        <div class="form-control">
                            <label>بیهایێ فرۆشتنێ:</label>
                            <input type="number" step="0.01" id="prod-price" required>
                        </div>
                        <button type="submit" class="btn-checkout" style="background: var(--accent-color);">زێدەبکە</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="scanner-modal">
        <div class="scanner-box">
            <h3>سکانکرنا بارکۆدی</h3>
            <div id="reader" style="width: 100%; margin-top: 15px;"></div>
            <br>
            <button class="nav-btn" style="background: var(--danger); color: white;" onclick="closeScanner()">داخستن</button>
        </div>
    </div>

    <div id="receipt-print" style="display: none;">
        <h2 style="text-align: center;">پسۆلا مارکێتێ</h2>
        <hr style="margin: 10px 0;">
        <div id="receipt-items"></div>
        <hr style="margin: 10px 0;">
        <h3 id="receipt-total-price"></h3>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('products_db')) || [
            { barcode: '1001', name: 'ئاڤ (0.5L)', cost: 0.15, price: 0.25, stock: 50, sold: 0 },
            { barcode: '1002', name: 'چبس لایز', cost: 0.35, price: 0.50, stock: 20, sold: 0 },
            { barcode: '1003', name: 'کۆلا قوتی', cost: 0.45, price: 0.75, stock: 0, sold: 0 }
        ];

        let cart = [];
        let salesHistory = JSON.parse(localStorage.getItem('sales_db')) || [];
        let html5QrcodeScanner = null;

        function renderProducts(items = products) {
            const container = document.getElementById('products-list');
            container.innerHTML = '';
            items.forEach(p => {
                const isOutOfStock = p.stock <= 0;
                container.innerHTML += `
                    <div class="product-card ${isOutOfStock ? 'out-of-stock' : ''}" onclick="addToCart('${p.barcode}')">
                        <div class="barcode-tag">#${p.barcode}</div>
                        <h4>${p.name}</h4>
                        <div class="stock-tag">${isOutOfStock ? 'تەمام بوو!' : 'عەمبار: ' + p.stock}</div>
                        <div class="price">$${p.price.toFixed(2)}</div>
                    </div>
                `;
            });
        }

        function addToCart(barcode) {
            const product = products.find(p => p.barcode === barcode);
            if (!product) return;
            if (product.stock <= 0) return alert("ئەڤ کەلاپەلە د عەمبارێ دا نەما یە!");

            const exist = cart.find(c => c.barcode === barcode);
            if (exist) {
                if (exist.qty + 1 > product.stock) return alert("بڕا داخوازکری ژ عەمبارێ زێدەترە!");
                exist.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price * item.qty;
                container.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>$${item.price} x ${item.qty}</small>
                        </div>
                        <div class="cart-item-actions">
                            <button class="btn-qty" onclick="changeQty(${index}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="btn-qty" onclick="changeQty(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cart-total').innerText = total.toFixed(2);
        }

        function changeQty(index, change) {
            const item = cart[index];
            const product = products.find(p => p.barcode === item.barcode);

            if (change > 0 && item.qty + 1 > product.stock) {
                return alert("بڕا زێدەتر د عەمبارێ دا نینە!");
            }

            item.qty += change;
            if (item.qty <= 0) cart.splice(index, 1);
            updateCart();
        }

        function handleSearch(e) {
            const val = document.getElementById('search-input').value.trim().toLowerCase();
            if (e.key === 'Enter' && val !== '') {
                const matched = products.find(p => p.barcode === val);
                if (matched) {
                    addToCart(matched.barcode);
                    document.getElementById('search-input').value = '';
                    renderProducts();
                    return;
                }
            }
            const filtered = products.filter(p => p.name.toLowerCase().includes(val) || p.barcode.includes(val));
            renderProducts(filtered);
        }

        function checkout() {
            if (cart.length === 0) return alert("سەبەتە یا بەتالە!");

            let total = 0;
            let receiptHTML = '';

            cart.forEach(item => {
                total += item.price * item.qty;
                const pIndex = products.findIndex(p => p.barcode === item.barcode);
                if (pIndex !== -1) {
                    products[pIndex].sold += item.qty;
                    products[pIndex].stock -= item.qty; 
                }

                salesHistory.push({
                    barcode: item.barcode,
                    qty: item.qty,
                    cost: item.cost * item.qty,
                    price: item.price * item.qty
                });

                receiptHTML += `<p>${item.name} (x${item.qty}) - $${(item.price * item.qty).toFixed(2)}</p>`;
            });

            localStorage.setItem('products_db', JSON.stringify(products));
            localStorage.setItem('sales_db', JSON.stringify(salesHistory));

            document.getElementById('receipt-items').innerHTML = receiptHTML;
            document.getElementById('receipt-total-price').innerText = "کۆما گشتی: $" + total.toFixed(2);

            window.print();

            cart = [];
            updateCart();
            renderProducts();
            alert("فرۆشتن ب سەرکەفتیانە تەمام بوو!");
        }

        function openScanner() {
            document.getElementById('scanner-modal').style.display = 'flex';
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((decodedText) => {
                addToCart(decodedText);
                closeScanner();
            });
        }

        function closeScanner() {
            if (html5QrcodeScanner) html5QrcodeScanner.clear();
            document.getElementById('scanner-modal').style.display = 'none';
        }

        function checkAdmin() {
            const pwd = prompt("تکایە پاسپۆرتێ رێڤەبەری بنڤێسە:");
            if (pwd === 'admin123') {
                switchTab('admin');
            } else {
                alert("پاسپۆرت شاشە!");
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            if (tab === 'pos') {
                document.getElementById('pos-tab').classList.add('active');
            } else {
                document.getElementById('admin-tab').classList.add('active');
                updateAdminStats();
            }
        }

        function deleteProduct(barcode) {
            if (confirm("ئەرێ تۆ ب ڕاستی دتەوێت ڤی کەلاپەلی بسڕیەوە؟")) {
                products = products.filter(p => p.barcode !== barcode);
                localStorage.setItem('products_db', JSON.stringify(products));
                renderProducts();
                updateAdminStats();
            }
        }

        function updateAdminStats() {
            let sales = 0, cost = 0;
            salesHistory.forEach(s => { sales += s.price; cost += s.cost; });

            document.getElementById('total-sales').innerText = `$${sales.toFixed(2)}`;
            document.getElementById('total-cost').innerText = `$${cost.toFixed(2)}`;
            document.getElementById('net-profit').innerText = `$${(sales - cost).toFixed(2)}`;

            const tbody = document.getElementById('admin-products-body');
            tbody.innerHTML = '';

            products.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.name}</td>
                        <td>${p.stock}</td>
                        <td>${p.sold}</td>
                        <td><button class="btn-delete" onclick="deleteProduct('${p.barcode}')">سڕینەوە</button></td>
                    </tr>
                `;
            });
        }

        function saveProduct(e) {
            e.preventDefault();
            const barcode = document.getElementById('prod-barcode').value.trim();
            const name = document.getElementById('prod-name').value.trim();
            const stock = parseInt(document.getElementById('prod-stock').value);
            const cost = parseFloat(document.getElementById('prod-cost').value);
            const price = parseFloat(document.getElementById('prod-price').value);

            if (products.some(p => p.barcode === barcode)) {
                return alert("ئەڤ بارکۆدە بەری نوکە هاتبوو تۆمارکرن!");
            }

            products.push({ barcode, name, stock, cost, price, sold: 0 });
            localStorage.setItem('products_db', JSON.stringify(products));

            alert("کەلاپەل هاتە زێدەکرن!");
            renderProducts();
            updateAdminStats();
            e.target.reset();
        }

        renderProducts();
    </script>
</body>
</html>
